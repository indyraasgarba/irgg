<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Indy Raas Garba Group — Navratri 2026 event flyer and donation information.">
  <title>Indy Raas Garba Group | Navratri 2026</title>
  <style>
    :root {
      color-scheme: light;
      --green: #064b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f7f2;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }
    header {
      background: var(--green);
      color: white;
      text-align: center;
      padding: 1.1rem 1rem;
    }
    header h1 {
      margin: 0 0 .35rem;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }
    header p { margin: 0; }
    
    /* Side-by-side layout container */
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      width: min(100% - 1.25rem, 1100px);
      margin: 1.5rem auto;
      align-items: flex-start;
      justify-content: center;
    }
    .flyer-box {
      flex: 1;
      min-width: 300px;
      max-width: 600px;
    }
    .flyer {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      border-radius: .35rem;
      box-shadow: 0 3px 16px #00000018;
    }
    
    /* Donation panel styling */
    .donation-box {
      flex: 0 0 300px;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 3px 16px #00000010;
    }
    .donation-box img {
      width: 140px;
      height: 140px;
      margin-bottom: 15px;
    }
    .donate-btn {
      background-color: #0070ba;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      display: inline-block;
      margin-top: 10px;
    }
    footer {
      text-align: center;
      padding: 1rem;
      color: #555;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Indy Raas Garba Group</h1>
    <p>Navratri 2026 • Garba, Raas &amp; Aarti</p>
  </header>
  
  <div class="container">
    <!-- Flyer on the left/main side -->
    <div class="flyer-box">
      <img class="flyer" src="garba-flyer-2026.jpg" alt="Indy Raas Garba Group Navratri 2026 event flyer.">
    </div>

    <!-- Donation panel on the side -->
    <div class="donation-box">
      <h3>Support Our Event</h3>
      <p style="font-size: 0.9rem;">Scan the QR code or click below to donate:</p>
      
      <img src="IRGG 2026 Donation QR Code.png" alt="Donation QR Code">
      
      <br>
      
      <a href="https://square.link/u/uJCrYVgG" target="_blank" class="donate-btn">
        Click Here to Donate
      </a>
    </div>
  </div>

  <footer>
    Indy Raas Garba Group
  </footer>
</body>
</html>
