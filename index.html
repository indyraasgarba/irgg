<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Indy Raas Garba Group — Navratri 2026 event flyer and donation information.">
  <title>Indy Raas Garba Group | Navratri 2026</title>
  <style>
    :root { color-scheme: light; --green:#064b3b; --orange:#d95b3f; --gold:#c9c75e; }
    * { box-sizing: border-box; }
    body { margin:0; background:#f7f7f2; color:#222; font-family:Arial,Helvetica,sans-serif; }
    header { background:var(--green); color:white; text-align:center; padding:1.1rem 1rem; }
    header h1 { margin:0 0 .35rem; font-size:clamp(1.4rem,4vw,2rem); }
    header p { margin:0; }
    main { width:min(100% - 1.25rem, 900px); margin:1.25rem auto 2rem; text-align:center; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:.75rem; margin:1rem 0 1.25rem; }
    .button { display:inline-block; padding:.8rem 1.05rem; border-radius:.55rem; text-decoration:none; font-weight:700; border:2px solid var(--green); color:var(--green); background:white; }
    .button.primary { background:var(--orange); color:white; border-color:var(--orange); }
    .flyer { display:block; width:100%; height:auto; background:white; border-radius:.35rem; box-shadow:0 3px 16px #00000018; }
    footer { text-align:center; padding:1rem; color:#555; font-size:.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Indy Raas Garba Group</h1>
    <p>Navratri 2026 • Garba, Raas &amp; Aarti</p>
  </header>
  <main>
    <p>View the event flyer below, or open and download a PDF copy.</p>
    <div class="actions">
      <a class="button primary" href="garba-flyer-2026.pdf" target="_blank" rel="noopener">View / Download PDF Flyer</a>
      <a class="button" href="garba-flyer-2026.jpg" download>Download Flyer Image</a>
    </div>
    <img class="flyer" src="garba-flyer-2026.jpg" alt="Indy Raas Garba Group Navratri 2026 event flyer. The flyer includes event dates, venue, donation QR code, and sponsorship contact information.">
    <div class="actions">
      <a class="button primary" href="garba-flyer-2026.pdf" target="_blank" rel="noopener">Open PDF Flyer</a>
    </div>
  </main>
  <footer>Indy Raas Garba Group • Please use the donation QR code shown on the flyer.</footer>
</body>
</html>
