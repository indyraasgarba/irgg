<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Indy Raas Garba Group — Navratri 2026 event flyer and donation information.">
  <title>Indy Raas Garba Group | Navratri 2026</title>
  <style>
    :root {
      color-scheme: light;
      --green: #064b3b;
      --orange: #d95b3f;
      --gold: #c9c75e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f7f2;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }
    header {
      background: var(--green);
      color: white;
      text-align: center;
      padding: 1.1rem 1rem;
    }
    header h1 {
      margin: 0 0 .35rem;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }
    header p { margin: 0; }
    main {
      width: min(100% - 1.25rem, 900px);
      margin: 1.25rem auto 2rem;
      text-align: center;
    }
    .flyer {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      border-radius: .35rem;
      box-shadow: 0 3px 16px #00000018;
      margin-bottom: 20px;
    }
    footer {
      text-align: center;
      padding: 1rem;
      color: #555;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Indy Raas Garba Group</h1>
    <p>Navratri 2026 • Garba, Raas &amp; Aarti</p>
  </header>
  
  <main>
    <!-- Event Flyer Image -->
    <img class="flyer" src="garba-flyer-2026.jpg" alt="Indy Raas Garba Group Navratri 2026 event flyer.">
  </main>

  <footer>
    Indy Raas Garba Group
  </footer>

  <!-- Donation Section with QR Code and Button -->
  <div style="text-align: center; padding: 30px; font-family: Arial, sans-serif; background-color: #f9f9f9; margin: 20px auto; max-width: 900px; border-radius: 8px;">
    <h3>Support Our Event</h3>
    <p>Scan the QR code below or click the button to make a donation:</p>
    
    <img src="IRGG 2026 Donation QR Code.png" alt="Donation QR Code" style="width: 150px; height: 150px; margin-bottom: 15px;">
    
    <br>
    
    <a href="https://square.link/u/uJCrYVgG" target="_blank" style="background-color: #0070ba; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">
      Click Here to Donate
    </a>
  </div>
</body>
</html>
