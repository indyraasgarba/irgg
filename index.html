<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Indy Raas Garba Group — Navratri 2026 event flyer and donation information.">
  <title>Indy Raas Garba Group | Navratri 2026</title>
  <style>
    :root {
      color-scheme: light;
      --green: #064b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f7f2;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }
    header {
      background: var(--green);
      color: white;
      text-align: center;
      padding: 1rem;
    }
    header h1 {
      margin: 0 0 .25rem;
      font-size: clamp(1.3rem, 3.5vw, 1.8rem);
    }
    header p { margin: 0; font-size: 0.9rem; }
    
    /* Layout container */
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      width: min(100% - 1.25rem, 1050px);
      margin: 1.25rem auto;
      align-items: flex-start;
      justify-content: center;
    }
    .flyer-box {
      flex: 1;
      min-width: 280px;
      max-width: 580px;
    }
    .flyer {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      border-radius: .35rem;
      box-shadow: 0 3px 16px #00000018;
    }
    
    /* Smaller donation panel styling */
    .donation-box {
      flex: 0 0 260px;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 3px 16px #00000010;
    }
    .donation-box h3 {
      font-size: 1.1rem;
      margin-top: 5px;
      margin-bottom: 8px;
    }
    .donation-box p {
      font-size: 0.82rem;
      color: #555;
      margin-bottom: 12px;
    }
    .donation-box img {
      width: 110px;
      height: 110px;
      margin-bottom: 12px;
    }
    .donate-btn {
      background-color: #0070ba;
      color: white;
      padding: 9px 16px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      display: inline-block;
    }
    footer {
      text-align: center;
      padding: 1rem;
      color: #555;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Indy Raas Garba Group</h1>
    <p>Navratri 2026 • Garba, Raas &amp; Aarti</p>
  </header>
  
  <div class="container">
    <!-- Flyer on the left/main side -->
    <div class="flyer-box">
      <img class="flyer" src="garba-flyer-2026.jpg" alt="Indy Raas Garba Group Navratri 2026 event flyer.">
    </div>

    <!-- Smaller donation panel on the side -->
    <div class="donation-box">
      <h3>Support Our Event</h3>
      <p>Scan the QR code or click below to donate:</p>
      
      <img src="IRGG 2026 Donation QR Code 2.png" alt="Donation QR Code">
      
      <br>
      
      <a href="LINK: https://square.link/u/uJCrYVgG target="_blank" class="donate-btn">
        Click Here to Donate
      </a>
    </div>
  </div>

  <footer>
    Indy Raas Garba Group
  </footer>
</body>
</html>
